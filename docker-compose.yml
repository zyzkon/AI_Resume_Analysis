# 当前环境并不使用这个文件 —— 项目连的是本机已有的 mysql:8.0 容器（3306），
# 库名 resume_db，用户 resume / resume_pass_2026。
#
# 这个文件是"那台 MySQL 万一被删了，怎么从零重建"的备份方案。
# 端口用 3307 是为了不和现有实例抢 3306；真要切过来，
# 把 .env 里的 DATABASE_URL 端口改成 3307 即可。
#
# 用法：docker compose up -d

services:
  mysql:
    image: mysql:8.0
    container_name: resume-mysql-standby
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_pass_2026
      MYSQL_DATABASE: resume_db
      MYSQL_USER: resume
      MYSQL_PASSWORD: resume_pass_2026
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    volumes:
      - ./docker/mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uresume", "-presume_pass_2026"]
      interval: 5s
      timeout: 3s
      retries: 20
