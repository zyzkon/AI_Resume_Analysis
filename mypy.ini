[mypy]
python_version = 3.12
files = app

# 第三方库里没有类型存根的直接跳过，不为它们写 stub。
# 本项目会命中的是 pypdf（纯 Python，但没带 py.typed）
ignore_missing_imports = True

# 报错信息带错误码（[arg-type] 之类）和列号，方便搜索和写 type: ignore 时精确定位
show_error_codes = True
show_column_numbers = True
pretty = True

# 这些是低成本的严格项，几乎不会误报，但能抓出真 bug：
# 多余的类型 ignore（说明代码改了、注解过期了）
warn_unused_ignores = True
warn_redundant_casts = True
# 明显不会执行到的分支（比如 isinstance 判断写反了）
warn_unreachable = True
# def f(x: int = None) 这类隐式可选，mypy 老版本默认放过，显式禁止
no_implicit_optional = True
# if x == "abc" 这种拿不同类型做相等比较，基本总是笔误
strict_equality = True

exclude = (?x)(
    ^\.venv/
    | ^uploads/
    | ^docker/
    )

[mypy-pypdf.*]
# pypdf 没有发布 py.typed，即使 ignore_missing_imports 关了也要放行
ignore_missing_imports = True
